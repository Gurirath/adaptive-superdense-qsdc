formulas:
  swap_waiting_time:
    expression: "expected attempts until all h links hold a pair = H_h / p, with H_h = 1 + 1/2 + ... + 1/h"
    source: "Sangouard, N., Simon, C., de Riedmatten, H., Gisin, N. (2011). Quantum repeaters based on atomic ensembles and linear optics. Reviews of Modern Physics 83, 33-80. DOI 10.1103/RevModPhys.83.33"
    note: "The review gives the prefactor 3/2 for two links and 25/12 for four links, each valid for small success probability. These equal H_2 and H_4. The review does not write out the general harmonic-number form; it is the same small-probability result for h links."
  swap_memory_decoherence:
    expression: "depolarising probability of a stored pair q_m = 1 - exp(-t_wait / T2)"
    source: "assumption: exponential loss of coherence with the memory time T2, applied to every link pair for the full waiting time, which overstates the storage time of the pairs created last; not applied at one hop, where nothing is stored"
  swap_memory_readout:
    expression: "end-to-end pair rate is multiplied by eta_mem^(2 (h - 1))"
    source: "assumption: each of the h - 1 intermediate nodes reads out two stored halves for its swap, each with the memory efficiency eta_mem; no factor at one hop"
  swap_fidelity:
    expression: "Werner parameter of the end-to-end pair = product of the Werner parameters of the h stored link pairs, where the Werner parameter is (4F - 1) / 3"
    source: "assumption: every link pair is a Werner state and each swap is a perfect Bell measurement that succeeds with probability bsm_eff"
